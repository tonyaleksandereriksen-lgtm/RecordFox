[workspace]
members = ["node"]

[package]
name = "rfx-native"
version = "0.1.0"
edition = "2021"
description = "RekordFox native audio: device shim, engine and the tools that test them"
license = "MIT"
publish = false
default-run = "rfx-probe"

[lib]
name = "rfx"
path = "src/lib.rs"

[[bin]]
name = "rfx-probe"
path = "src/main.rs"

[[bin]]
name = "rfx-demo"
path = "src/bin/demo.rs"

[[bin]]
name = "rfx-tests"
path = "src/bin/tests.rs"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
